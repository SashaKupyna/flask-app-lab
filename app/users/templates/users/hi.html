{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-3 mb-4">
    <!-- Vertical navigation -->
    <div class="card p-3">
      <h5 class="card-title text-light mb-3">FlaskApp</h5>
      <nav>
        <ul class="nav flex-column gap-2">
          <li class="nav-item">
            <a class="nav-link text-light bg-dark rounded border border-secondary" href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light bg-dark rounded border border-secondary" href="{{ url_for('users.admin') }}">Admin</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="col-md-9">
    <!-- Main content -->
    <div class="card p-4">
      <h2 class="mb-4">Hello :)</h2>
      <p class="fs-4 mb-2">User: <strong>{{ name }}</strong></p>
      {% if age %}
        <p class="fs-4 text-success mb-0">Age: <strong>{{ age }}</strong></p>
      {% else %}
        <p class="fs-4 text-danger mb-0">Age: Not provided</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
