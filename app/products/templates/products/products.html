{% extends 'base.html' %}

{% block title %}Каталог товарів{% endblock %}

{% block content %}
<h2 class="mb-4">Список товарів</h2>

<div class="row">
  {% for product in products %}
  <div class="col-md-4 mb-4">
    <div class="card p-3 h-100">
      <h4 class="card-title">{{ product.name }}</h4>
      <p class="text-success fs-5">Ціна: ${{ product.price }}</p>
      <p class="card-text">{{ product.content }}</p>
      <a href="{{ url_for('.product_detail', product_id=product.id) }}" class="btn btn-primary mt-auto">Детальніше</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
